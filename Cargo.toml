[package]
name = "whereis"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Instant filename search on Linux by reading filesystem metadata directly from the block device"
license = "MIT"
repository = "https://github.com/YuleBest/whereis"

[[bin]]
name = "wis"
path = "src/main.rs"

# The disk side is deliberately dependency-free -- talking to the block device
# ourselves is the whole point. Two exceptions: `regex`, because hand-rolling a
# regex engine would be a project in itself (and its `bytes` API handles non-UTF-8
# names), and `libc`, for localtime_r and the passwd/group lookups the listing
# columns need.
[dependencies]
libc = "0.2"
regex = "1.13.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
