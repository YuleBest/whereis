name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # Releases ship a static musl binary, so build one here too: a breakage
      # then shows up on every push instead of at tag time.
      - name: Static build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl

      # Everything interesting needs a block device and root, which CI has
      # neither of, so this is as far as the binary can be exercised here. It
      # does cover the locale resolution, which is otherwise easy to break.
      - name: Smoke test
        run: |
          wis=./target/x86_64-unknown-linux-musl/release/wis
          "$wis" --version
          "$wis" --help > /dev/null
          env -u LANGUAGE -u LC_ALL -u LC_MESSAGES LANG=zh_CN.UTF-8 "$wis" --help | grep -q '即时搜索'
          env -u LANGUAGE -u LC_ALL -u LC_MESSAGES LANG=zh_TW.UTF-8 "$wis" --help | grep -q '即時搜尋'
          env -u LANGUAGE -u LC_ALL -u LC_MESSAGES LANG=en_US.UTF-8 "$wis" --help | grep -q 'instant filename search'
          env -u LANGUAGE -u LC_ALL -u LC_MESSAGES LANG=de_DE.UTF-8 "$wis" --help | grep -q 'instant filename search'
