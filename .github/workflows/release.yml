name: Release

on:
  push:
    tags: ["v*"]

# Creating a release needs more than the default read-only token.
permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl, so the binaries do not depend on the glibc of whatever
          # runner built them. The arm64 runner is available because the
          # repository is public.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            deb_arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        timeout-minutes: 5
        run: |
          # -q, not -qq: a stalled mirror should leave a trace in the log.
          sudo apt-get update -q
          sudo apt-get install -y -qq musl-tools

      - name: Add musl target
        timeout-minutes: 5
        run: rustup target add ${{ matrix.target }}

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary and deb
        run: |
          version="${GITHUB_REF_NAME#v}"
          maintainer="$(git log -1 --format='%an <%ae>')"
          mkdir -p dist/pkg/usr/bin dist/pkg/DEBIAN
          install -m 0755 "target/${{ matrix.target }}/release/wis" \
            "dist/wis-${version}-${{ matrix.target }}"
          install -m 0755 "target/${{ matrix.target }}/release/wis" dist/pkg/usr/bin/wis
          installed="$(du -sk dist/pkg/usr | cut -f1)"
          {
            echo "Package: wis"
            echo "Version: ${version}"
            echo "Architecture: ${{ matrix.deb_arch }}"
            echo "Maintainer: ${maintainer}"
            echo "Installed-Size: ${installed}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Homepage: https://github.com/${GITHUB_REPOSITORY}"
            echo "Description: instant filename search on Linux (wis)"
            echo " Searches file names by reading ext4 metadata straight from the block"
            echo " device instead of walking the directory tree."
          } > dist/pkg/DEBIAN/control
          dpkg-deb --build --root-owner-group dist/pkg \
            "dist/wis_${version}_${{ matrix.deb_arch }}.deb"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/wis-*
            dist/wis_*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running the workflow should update the release, not fail on it.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
