name: Release

on:
  push:
    tags: ["v*"]

# Creating a release needs more than the default read-only token.
permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl, so the binary does not depend on the glibc of whatever
          # runner built it. Add targets here as needed; the packaging step is
          # target-agnostic.
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup target add ${{ matrix.target }}

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Set the ownership explicitly, or extracting as root leaves the CI
          # runner's uid on the installed binary.
          tar -C "target/${{ matrix.target }}/release" --owner=root --group=root \
            -czf "dist/wis-${version}-${{ matrix.target }}.tar.gz" wis
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running the workflow should update the release, not fail on it.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
